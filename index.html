<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totally Normal Survey</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1a1a1a;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #262626;
      color: white;
      margin-bottom: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background-color: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:active {
      background-color: #4338ca;
    }

    .message {
      margin-top: 15px;
      font-size: 15px;
      min-height: 20px;
      color: #ff4d4d;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- QUESTION 1: USERNAME -->
  <div class="card" id="q1-card">
    <h2>Question 1: Type your username</h2>
    <input type="text" id="username-input" placeholder="Enter username...">
    <button id="q1-btn">Next</button>
    <div class="message" id="q1-message"></div>
  </div>

  <!-- QUESTION 2: AGE -->
  <div class="card hidden" id="q2-card">
    <h2>Question 2: What is your age?</h2>
    <input type="number" id="age-input" placeholder="Enter your age...">
    <button id="q2-btn">Next</button>
    <div class="message" id="q2-message"></div>
  </div>

  <script>
    // --- QUESTION 1 LOGIC ---
    const q1Card = document.getElementById("q1-card");
    const usernameInput = document.getElementById("username-input");
    const q1Btn = document.getElementById("q1-btn");
    const q1Message = document.getElementById("q1-message");
    let firstValidUsername = "";

    // --- QUESTION 2 LOGIC ---
    const q2Card = document.getElementById("q2-card");
    const ageInput = document.getElementById("age-input");
    const q2Btn = document.getElementById("q2-btn");
    const q2Message = document.getElementById("q2-message");
    let usedAges = []; // Stores the 5 ages they try so they can't reuse them

    q1Btn.addEventListener("click", function() {
      const name = usernameInput.value.trim();

      if (name === "") {
        q1Message.textContent = "You didn't even type anything.";
        return;
      }
      if (!/[0-9]/.test(name)) {
        q1Message.textContent = "Your username must include a number.";
        return;
      }
      if (!/[A-Z]/.test(name)) {
        q1Message.textContent = "Your username must include a capital letter.";
        return;
      }
      if (!/[^a-zA-Z0-9]/.test(name)) {
        q1Message.textContent = "Your username must include a symbol (like !, @, #, $).";
        return;
      }
      if (firstValidUsername === "" || name === firstValidUsername) {
        firstValidUsername = name;
        q1Message.textContent = `Sorry, "${name}" is already taken by another user. Choose another name.`;
        return;
      }

      // Passed Question 1 -> Switch to Question 2
      q1Message.style.color = "#4ade80";
      q1Message.textContent = `Fine. "${name}" is available.`;
      
      setTimeout(function() {
        q1Card.classList.add("hidden");
        q2Card.classList.remove("hidden");
      }, 1000);
    });

    q2Btn.addEventListener("click", function() {
      const age = ageInput.value.trim();

      if (age === "" || Number(age) <= 0) {
        q2Message.style.color = "#ff4d4d";
        q2Message.textContent = "Please enter a real age.";
        return;
      }

      // Prevent them from just spamming the exact same number 5 times
      if (usedAges.includes(age)) {
        q2Message.style.color = "#ff4d4d";
        q2Message.textContent = `I already told you age ${age} is taken! Pick a different number.`;
        return;
      }

      // Lie for the first 5 unique ages
      if (usedAges.length < 5) {
        usedAges.push(age);
        q2Message.style.color = "#ff4d4d";
        q2Message.textContent = `Sorry, age ${age} is already taken by another user. Please choose another age.`;
        ageInput.value = ""; // Clears the box to annoy them even more
        return;
      }

      // 6th unique age passes!
      q2Message.style.color = "#4ade80";
      q2Message.textContent = `Congrats! Nobody took age ${age} yet. Moving to Question 3...`;
    });
  </script>

</body>
</html>
