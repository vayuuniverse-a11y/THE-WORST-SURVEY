<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totally Normal Survey</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1a1a1a;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #262626;
      color: white;
      margin-bottom: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background-color: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:active {
      background-color: #4338ca;
    }

    #message {
      margin-top: 15px;
      font-size: 15px;
      min-height: 20px;
      color: #ff4d4d;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Type your username</h2>
    <input type="text" id="username-input" placeholder="Enter username...">
    <button id="submit-btn">Next</button>
    <div id="message"></div>
  </div>

  <script>
    const input = document.getElementById("username-input");
    const submitBtn = document.getElementById("submit-btn");
    const message = document.getElementById("message");

    // Tracks the first valid username they manage to enter
    let firstValidUsername = "";

    submitBtn.addEventListener("click", function() {
      const name = input.value.trim();

      // Check 1: Empty box
      if (name === "") {
        message.style.color = "#ff4d4d";
        message.textContent = "You didn't even type anything.";
        return;
      }

      // Check 2: Must have a number
      if (!/[0-9]/.test(name)) {
        message.style.color = "#ff4d4d";
        message.textContent = "Your username must include a number.";
        return;
      }

      // Check 3: Must have a capital letter
      if (!/[A-Z]/.test(name)) {
        message.style.color = "#ff4d4d";
        message.textContent = "Your username must include a capital letter.";
        return;
      }

      // Check 4: Must have a symbol
      if (!/[^a-zA-Z0-9]/.test(name)) {
        message.style.color = "#ff4d4d";
        message.textContent = "Your username must include a symbol (like !, @, #, $).";
        return;
      }

      // Check 5: "Already taken" troll!
      // The VERY FIRST time they satisfy all rules, lie and say it's taken.
      if (firstValidUsername === "" || name === firstValidUsername) {
        firstValidUsername = name;
        message.style.color = "#ff4d4d";
        message.textContent = `Sorry, "${name}" is already taken by another user. Choose another name.`;
        return;
      }

      // If they change it to a SECOND valid name, let them pass!
      message.style.color = "#4ade80";
      message.textContent = `Fine. "${name}" is available. Moving to Question 2...`;
    });
  </script>

</body>
</html>
