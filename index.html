<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing to see here</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #secret-btn {
      position: fixed;
      top: 0;
      right: 0;
      width: 70px;
      height: 70px;
      background-color: transparent;
      opacity: 0;
      border: none;
      cursor: default;
    }

    #owner-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #1a1a1a;
      border: 2px solid #444;
      padding: 40px 60px;
      border-radius: 12px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <button id="secret-btn" aria-label="Secret"></button>

  <div id="owner-popup">You are owner</div>

  <script>
    let clickCount = 0;
    const ownerEmail = "vayuuniverse@gmail.com";
    const secretBtn = document.getElementById("secret-btn");
    const ownerPopup = document.getElementById("owner-popup");

    // 1. Check if this device was already verified before
    if (localStorage.getItem("verified_owner") === "true") {
      ownerPopup.style.display = "block";
    }

    // 2. Invisible 3-tap trigger for first-time verification
    secretBtn.addEventListener("click", function() {
      clickCount++;

      if (clickCount === 3) {
        clickCount = 0; // Reset count in case of typo
        const enteredEmail = prompt("Enter owner email:");

        if (enteredEmail && enteredEmail.trim().toLowerCase() === ownerEmail) {
          localStorage.setItem("verified_owner", "true");
          ownerPopup.style.display = "block";
        } else if (enteredEmail !== null) {
          alert("Access denied.");
        }
      }
    });
  </script>

</body>
</html>
