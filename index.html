<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Totally Normal Survey</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d0d0d;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;padding:20px;overflow:hidden}
.card{background:#1a1a1a;border:1px solid #333;padding:30px;border-radius:12px;width:100%;max-width:400px;text-align:center}
h2{margin-bottom:20px;font-size:22px}
input{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #444;background:#262626;color:#fff;margin-bottom:15px;outline:none}
.btn{width:100%;padding:12px;font-size:16px;font-weight:bold;border-radius:8px;border:none;background:#4f46e5;color:#fff;cursor:pointer}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:15px}
.c-btn{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #444;background:#262626;color:#fff;cursor:pointer}
.c-btn.sel{background:#4f46e5;border-color:#818cf8;font-weight:bold}
#alarm{display:none;color:#ff1a1a;font-size:20px;font-weight:900;margin-top:15px;animation:blink .25s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.2}}
.run{position:fixed!important;width:110px!important;z-index:999;background:#ef4444!important}
.leg{display:none;position:absolute;bottom:-14px;width:6px;height:16px;background:#fff;border-radius:3px}
.run .leg{display:block}
.l{left:30px;animation:rl .12s infinite alternate}
.r{right:30px;animation:rr .12s infinite alternate}
@keyframes rl{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
@keyframes rr{from{transform:rotate(35deg)}to{transform:rotate(-35deg)}}
.msg{margin-top:15px;font-size:15px;min-height:20px;color:#ff4d4d}
.hide{display:none}
</style>
</head>
<body>

<div class="card" id="q1">
  <h2>Question 1: Type your username</h2>
  <input type="text" id="u-in" placeholder="Enter username...">
  <button class="btn" id="q1-btn">Next</button>
  <div class="msg" id="q1-msg"></div>
</div>

<div class="card hide" id="q2">
  <h2>Question 2: What is your age?</h2>
  <input type="number" id="a-in" placeholder="Enter your age...">
  <button class="btn" id="q2-btn">Next</button>
  <div class="msg" id="q2-msg"></div>
</div>

<div class="card hide" id="q3">
  <h2>Question 3: How are you feeling?</h2>
  <div class="choices">
    <button class="c-btn">Good</button>
    <button class="c-btn">Not Good</button>
    <button class="c-btn">Feel Normal</button>
  </div>
  <button class="btn" id="q3-btn">Next<span class="leg l"></span><span class="leg r"></span></button>
  <div id="alarm">🚨 CATCH THE BUTTON TO CONTINUE! 🚨</div>
  <div class="msg" id="q3-msg"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let firstU="",ages=[],mood="",run=false,rInt,aInt,ctx;

$("q1-btn").onclick=()=>{
  const n=$("u-in").value.trim(),m=$("q1-msg");
  if(!n)return m.textContent="You didn't even type anything.";
  if(!/[0-9]/.test(n))return m.textContent="Must include a number.";
  if(!/[A-Z]/.test(n))return m.textContent="Must include a capital letter.";
  if(!/[^a-zA-Z0-9]/.test(n))return m.textContent="Must include a symbol (!, @, #).";
  if(!firstU||n===firstU){firstU=n;return m.textContent=`Sorry, "${n}" is already taken.`;}
  m.style.color="#4ade80";m.textContent=`Fine. "${n}" is available.`;
  setTimeout(()=>{$("q1").classList.add("hide");$("q2").classList.remove("hide");},900);
};

$("q2-btn").onclick=()=>{
  const a=$("a-in").value.trim(),m=$("q2-msg");
  if(!a||+a<=0)return m.textContent="Enter a real age.";
  if(ages.includes(a))return m.textContent=`Age ${a} is already taken!`;
  if(ages.length<5){ages.push(a);$("a-in").value="";return m.textContent=`Age ${a} is already taken. Try another.`;}
  m.style.color="#4ade80";m.textContent=`Congrats! Age ${a} is free.`;
  setTimeout(()=>{$("q2").classList.add("hide");$("q3").classList.remove("hide");},900);
};

function alarm(on){
  if(!on){clearInterval(aInt);if(ctx)ctx.close();return;}
  ctx=new(window.AudioContext||window.webkitAudioContext)();let hi=true;
  aInt=setInterval(()=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sawtooth";o.frequency.value=hi?880:620;g.gain.value=.15;
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.18);hi=!hi;
  },200);
}

document.querySelectorAll(".c-btn").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".c-btn").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel");mood=b.textContent;
  if(!run){
    run=true;$("alarm").style.display="block";$("q3-msg").textContent="";
    const btn=$("q3-btn");btn.classList.add("run");document.body.appendChild(btn);alarm(true);
    rInt=setInterval(()=>{
      btn.style.left=Math.max(10,Math.random()*(innerWidth-120))+"px";
      btn.style.top=Math.max(10,Math.random()*(innerHeight-60))+"px";
    },220);
  }
});

$("q3-btn").onclick=()=>{
  if(!mood)return $("q3-msg").textContent="Pick a mood first!";
  if(run){
    clearInterval(rInt);alarm(false);run=false;
    const btn=$("q3-btn");btn.classList.remove("run");btn.style.position="static";
    $("q3").insertBefore(btn,$("alarm"));$("alarm").style.display="none";
    $("q3-msg").style.color="#4ade80";$("q3-msg").textContent="HOW DID YOU CATCH THAT?! You pass!";
  }
};
</script>
</body>
</html>
